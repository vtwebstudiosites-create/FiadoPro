
name: Gerar APK FiadoPro

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto Android
        run: |
          unzip -o 'FiadoPro_Android.zip..zip'
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Encontrar e instalar Android SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Compilar APK
        run: |
          APP_GRADLE="$(find . -path '*/app/build.gradle.kts' -print -quit)"
          if [ -z "$APP_GRADLE" ]; then
            echo "ERRO: não encontrei app/build.gradle.kts"
            find . -name "build.gradle.kts"
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()
          config = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          '''
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              s = s.replace('android {', 'android {\n' + config, 1)
              p.write_text(s)
          PY

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          echo "Projeto encontrado em: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: FiadoPro-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
