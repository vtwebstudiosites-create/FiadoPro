<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FiadoPro</title>


<style>
:root{--bg:#101114;--bg2:#151D2B;--card:#161b26;--line:#262e3d;--gold:#D6AD60;--gtx:#101114;--tx:#F5F5F5;--mut:#98a2b3;--ok:#4ade80;--bad:#e5766f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#F5F5F5;--bg2:#e8ecf2;--card:#fff;--line:#dde2ea;--gold:#8f6b1f;--gtx:#fff;--tx:#151D2B;--mut:#5b6575;--ok:#15803d;--bad:#b42318;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num,.big{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.02em}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.lg{display:flex;gap:10px;align-items:center}.lg b{display:block;font-size:15px}.lg small{color:var(--mut);font-size:12px}
.ib{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
main{padding:8px 16px 120px;max-width:560px;margin:auto}
h1{font-size:22px;margin:10px 0 2px}h2{font-size:16px;margin:22px 0 10px}h3{margin:6px 0 14px;font-size:18px}
.mut{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.hero{background:linear-gradient(160deg,var(--bg2),var(--card));border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.big{font-size:36px;margin:2px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0;padding:13px}
.grid .num{font-size:20px;display:block;margin-top:4px}
.btn,.btn2{border:0;border-radius:14px;padding:14px;font-weight:800;width:100%;cursor:pointer;background:var(--gold);color:var(--gtx);margin-top:12px}
.btn2{background:transparent;color:var(--tx);border:1px solid var(--line)}.btn:active,.btn2:active{transform:scale(.98)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .btn,.two .btn2{margin-top:10px}
.sm{padding:9px 12px;font-size:13px;width:auto;margin:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}.row>div:nth-child(2){flex:1;min-width:0}.row b,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mut);font-size:12px}
.av{width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-weight:800;color:var(--gold);flex:none}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;border:1px solid currentColor;display:inline-block}.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}.t-mut{color:var(--mut)}.t-g{color:var(--gold)}
.pos{color:var(--bad)}.neg{color:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600}.chip.on{background:var(--gold);color:var(--gtx);border-color:var(--gold)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:5px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:block;margin-top:12px;font-size:13px;color:var(--mut);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{background:none;border:0;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 0}nav button.on{color:var(--gold)}
nav .fab{background:var(--gold);color:var(--gtx);width:56px;height:56px;border-radius:18px;margin:-26px auto 0;font-size:30px;box-shadow:0 8px 20px rgba(214,173,96,.35);justify-content:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}.gr{width:40px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}.prev{margin-top:10px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:6px}.seg button{border:0;background:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer}.seg .on{background:var(--gold);color:var(--gtx)}
.ir{display:grid;grid-template-columns:1fr 54px 80px;gap:6px;margin-top:8px}.ir input{margin:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;z-index:40;animation:up .2s}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;border:1px solid currentColor}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}.empty b{display:block;color:var(--tx);margin-bottom:4px}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:auto}
#spl{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;animation:fo .5s 1.1s forwards}@keyframes fo{to{opacity:0;visibility:hidden}}
#spl svg{animation:pp .9s ease-out}@keyframes pp{from{transform:scale(.7);opacity:0}}
.okc{text-align:center}.okc path{stroke-dasharray:40;stroke-dashoffset:40;animation:dr .6s .1s forwards}@keyframes dr{to{stroke-dashoffset:0}}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:12px;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pc{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.pc.on{border-color:var(--gold)}
.pi{display:grid;place-items:center;height:110px}.pi{overflow:hidden}.pi img{display:block}.pi svg{max-height:100%}
.pc b{display:block;font-size:14px;margin-top:6px;line-height:1.25}.pc small{color:var(--mut);display:block;margin-top:2px}
.pc input{text-align:center;margin-top:6px;padding:10px}
.st{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
.st button{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:28px;font-weight:800;cursor:pointer;line-height:1}
.st button.pl{background:var(--gold);color:var(--gtx);border-color:var(--gold)}
.st .q{font-size:24px;min-width:30px;text-align:center}
:root[data-big=on] main,:root[data-big=on] .sh{zoom:1.18}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* Acessibilidade FiadoPro: otimizado para uso por pessoas idosas em celular */
html { font-size: 18px; }
body { font-size: 18px; line-height: 1.45; }
button, input, select, textarea { font-size: 18px !important; }
button, .btn, .ib, [role="button"] { min-height: 52px; }
input, select, textarea { min-height: 52px; padding-top: 12px; padding-bottom: 12px; }
button, .btn { padding-top: 13px; padding-bottom: 13px; }
small, .mut, .lg small { font-size: 14px !important; line-height: 1.4; }
h1 { font-size: 26px; line-height: 1.2; }
h2 { font-size: 20px; line-height: 1.25; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
@media (max-width: 380px) {
  html, body { font-size: 17px; }
  main { padding-left: 12px; padding-right: 12px; }
}

function add(cid,t,d,o={}){if(!cl(cid))throw new Error('Cliente não encontrado.');if(!Number.isSafeInteger(d)||d===0)throw new Error('Lançamento inválido: o valor precisa ser diferente de zero e estar em centavos.');const a=bal(cid),p=a+d;if(p<0)throw new Error('Operação deixaria o saldo negativo.');

function cycle(id){let s=0,st=null;for(const m of movsOf(id).sort((a,b)=>a.at<b.at?-1:1)){if(s==0&&m.d>0)st=m.at;s+=m.d}return s>0?st:null}
function dueDate(c){if(!c.dia||bal(c.id)<=0)return null;const st=new Date(cycle(c.id)),mk=(y,m)=>new Date(y,m,Math.min(c.dia,new Date(y,m+1,0).getDate()),23,59,59);let d=mk(st.getFullYear(),st.getMonth());if(dk(d)<=dk(st))d=mk(st.getFullYear(),st.getMonth()+1);return d}

 okCompra:cid=>tf(()=>{let it=[],tot=0,desc;if(S.mode=='p'){for(const[id,q]of Object.entries(S.cart)){const p=DB.p.find(y=>y.id==id);if(!p||!(q>0))continue;if(!p.pr)throw new Error('Digite o preço de '+p.n+'.');const t=q*p.pr;it.push({d:p.n,q,p:p.pr,t});tot+=t}if(!it.length)throw new Error('Toque no + para escolher ao menos um produto.');desc=it.map(i=>i.q+'× '+i.d).join(', ')}else if(S.mode=='i'){for(const r of document.querySelectorAll('#rows .ir')){const d=r.querySelector('.d').value.trim(),pv=r.querySelector('.p').value,q=parseFloat(r.querySelector('.q').value.replace(',','.')),p=num(pv);if(!d&&!pv)continue;if(!d||!Number.isFinite(q)||q<=0||!Number.isFinite(p)||p<=0)throw new Error('Preencha produto, quantidade e preço maiores que zero em cada item.');const t=Math.round(q*p);if(t<=0)throw new Error('O valor de cada item precisa ser de pelo menos R$ 0,01.');it.push({d,q,p,t});tot+=t}
  if(!it.length)throw new Error('Adicione ao menos um item.');desc=it.map(i=>i.q+'× '+i.d).join(', ')}else{desc=$('#qd').value.trim();tot=num($('#qv').value);if(!desc||isNaN(tot))throw new Error('Informe a descrição e um valor válido.')}
  if(!Number.isFinite(tot)||tot<=0)throw new Error('O valor total da compra precisa ser maior que zero. Confira quantidades e preços.');const at=iso($('#dt').value),obs=$('#ob').value.trim(),c=cl(cid),go=()=>tf(()=>{add(cid,'compra',tot,{desc,it:it.length?it:null,at,obs});closeS();render();toast('Compra fiada registrada')});
  if(c.lim&&bal(cid)+tot>c.lim)ask(`Esta compra leva o saldo a ${R(bal(cid)+tot)}, acima do limite de ${R(c.lim)}. Registrar mesmo assim?`,go);else go()}),
 pagto:cid=>{const b=bal(cid);if(b<=0)return toast('Este cliente não tem saldo em aberto');sheet('Registrar pagamento',`<span class="mut">Saldo atual</span><div class="big">${R(b)}</div><label>Valor pago<input id="v" inputmode="decimal" placeholder="0,00" data-i="pv" data-x="${cid}"></label><div class="chips">${[25,50,75,100].map(p=>`<button class="chip" data-a="pct" data-x="${cid}|${p}">${p==100?'Integral':p+'%'}</button>`).join('')}</div>${fpH()}<label>Data e hora<input id="dt" type="datetime-local" value="${nowL()}"></label><label>Observação<input id="ob"></label><div class="prev" id="pv"></div><div class="err" id="er"></div><button class="btn" data-a="okPag" data-x="${cid}">Confirmar pagamento</button>`)},
 pct:x=>{const[c,p]=x.split('|');$('#v').value=fmtIn(Math.round(bal(c)*p/100));A.pv(c)},
 pv:c=>{const v=num($('#v').value);$('#pv').textContent=isNaN(v)?'':'Novo saldo: '+R(Math.max(bal(c)-v,0))},
 okPag:cid=>tf(()=>{const b=bal(cid),v=num($('#v').value);if(!Number.isFinite(v)||v<=0)throw new Error('Informe um valor maior que zero.');if(b<=0)throw new Error('Este cliente não tem saldo em aberto.');const at=iso($('#dt').value),fp=$('#fp').value,ob=$('#ob').value.trim();
  const go=(val,ex)=>tf(()=>{add(cid,'pagamento',-val,{desc:'Pagamento',fp,at,obs:[ob,ex].filter(Boolean).join(' · ')});closeS();render();toast('Pagamento registrado')});
  if(v>b)ask(`O valor (${R(v)}) é maior que a dívida (${R(b)}). Será lançado apenas ${R(b)} como pagamento; os ${R(v-b)} excedentes ficam fora do saldo (troco ou crédito a combinar). Continuar?`,()=>go(b,`Recebido ${R(v)}; excedente de ${R(v-b)} não lançado`));else go(v,'')}),
 quitar:cid=>{const b=bal(cid);if(b<=0)return toast('Este cliente já está quitado');sheet('Quitar dívida',`<span class="mut">Saldo restante</span><div class="big">${R(b)}</div><label>Valor recebido<input id="v" inputmode="decimal" value="${fmtIn(b)}"></label>${fpH()}<label>Data e hora<input id="dt" type="datetime-local" value="${nowL()}"></label><div class="err" id="er"></div><button class="btn" data-a="okQuit" data-x="${cid}">Confirmar quitação</button>`)},
 okQuit:cid=>tf(()=>{const b=bal(cid),v=num($('#v').value);if(!Number.isFinite(v)||v<=0||b<=0||v<b)throw new Error('Para quitar, informe um valor positivo que cubra o saldo de '+R(b)+'.');const fp=$('#fp').value;
  const m=add(cid,'quitacao',-b,{desc:'Quitação total',fp,at:iso($('#dt').value),obs:v>b?`Recebido ${R(v)}; troco de ${R(v-b)}`:''});
  sheet('',`<div class="okc"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M7 12.500l3.500 3.500L17 9"/></svg><h2>Dívida quitada com sucesso!</h2><p class="mut">${R(b)} · ${esc(fp)}</p><button class="btn" data-a="recibo" data-x="${m.id}">Gerar recibo</button><button class="btn2" data-a="close" style="margin-top:10px">Fechar</button></div>`);render()}),
 recibo:id=>{const m=DB.m.find(x=>x.id==id),c=cl(m.c);sheet('Recibo',txt(`RECIBO · ${DB.u.dep}\n\nCliente: ${c.n}\nValor pago: ${R(m.v)}\nForma de pagamento: ${m.fp||'—'}\nData: ${DT(m.at)}\nSaldo final: ${R(m.p)}\nNº ${m.id.toUpperCase()}\n\nAssinatura: ____________________`,'tx'))},
 ajuste:cid=>{S.sg=1;sheet('Ajustar saldo',`<div class="seg"><button class="on" data-a="sg" data-x="1">Acrescentar</button><button data-a="sg" data-x="-1">Reduzir</button></div><label>Valor do ajuste<input id="v" inputmode="decimal" data-i="aj" data-x="${cid}" placeholder="0,00"></label><label>Motivo (obrigatório)<input id="mot"></label><label>Data e hora<input id="dt" type="datetime-local" value="${nowL()}"></label><div class="prev" id="pv">Saldo anterior: ${R(bal(cid))}</div><div class="err" id="er"></div><button class="btn" data-a="okAj" data-x="${cid}">Confirmar ajuste</button>`)},
 sg:x=>{S.sg=+x;document.querySelectorAll('#sh .seg button').forEach((b,i)=>b.classList.toggle('on',(i==0)==(x==1)));const b=$('.btn[data-a=okAj]');A.aj(b.dataset.x)},
 aj:cid=>{const v=num($('#v').value),a=bal(cid);$('#pv').textContent=`Saldo anterior: ${R(a)}`+(isNaN(v)?'':` → posterior: ${R(a+S.sg*v)}`)},
 okAj:cid=>tf(()=>{const v=num($('#v').value),mot=$('#mot').value.trim();if(!Number.isFinite(v)||v<=0)throw new Error('Informe um valor de ajuste maior que zero.');if(!mot)throw new Error('Informe o motivo do ajuste.');add(cid,'ajuste',S.sg*v,{desc:'Ajuste manual',mot,at:iso($('#dt').value)});closeS();render();toast('Ajuste registrado')}),
 est:id=>{const m=DB.m.find(x=>x.id==id);sheet('Estornar lançamento',`<p class="mut">${TN[m.t]} de ${R(m.v)} em ${DT(m.at)}. O registro original continua no histórico e um estorno é criado.</p><label>Motivo (obrigatório)<input id="mot"></label><div class="err" id="er"></div><button class="btn" data-a="okEst" data-x="${id}">Confirmar estorno</button>`)},
 okEst:id=>tf(()=>{const m=DB.m.find(x=>x.id==id),mot=$('#mot').value.trim();if(!mot)throw new Error('Informe o motivo do estorno.');if(estornada(m))throw new Error('Este lançamento já foi estornado.');add(m.c,'estorno',-m.d,{orig:m.id,desc:'Estorno de '+TN[m.t].toLowerCase(),mot});closeS();render();toast('Estorno registrado')}),
 cobrar:cid=>{const c=cl(cid),d=dueDate(c),m=`Olá, ${c.ap||c.n.split(' ')[0]}! Tudo bem? Passando para lembrar do seu saldo de ${R(bal(cid))} aqui no ${DB.u.dep}${d?`, combinado para ${D(d)}`:''}. Qualquer dúvida, é só chamar. Obrigado!`;sheet('Mensagem de cobrança',`<p class="mut">Revise o texto. Nada é enviado sem a sua ação.</p><textarea id="wm" rows="6">${esc(m)}</textarea><button class="btn" data-a="wa" data-x="${cid}">Abrir no WhatsApp</button><button class="btn2" data-a="cp" data-x="#wm" style="margin-top:10px">Copiar texto</button>`)},
 wa:cid=>{let t=(cl(cid).tel||'').replace(/\D/g,'');if(t&&t.length<=11)t='55'+t;window.open(`https://wa.me/${t}?text=${encodeURIComponent($('#wm').value)}`,'_blank')},
 csv:()=>{const a=new Date(S.rf+'T00:00'),b=new Date(S.rt+'T00:00');b.setDate(b.getDate()+1);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',L=[['data','cliente','tipo','descricao','valor','saldo_anterior','saldo_posterior','forma','observacao'].join(';')];
  DB.m.filter(m=>new Date(m.at)>=a&&new Date(m.at)<b).forEach(m=>L.push([DT(m.at),cl(m.c)?.n,TN[m.t],m.desc,(m.d/100).toFixed(2).replace('.',','),(m.a/100).toFixed(2).replace('.',','),(m.p/100).toFixed(2).replace('.',','),m.fp,[m.obs,m.mot].filter(Boolean).join(' / ')].map(q).join(';')));sheet('Exportar CSV',txt(L.join('\n'),'tx'))},
 prt:()=>{try{window.print()}catch(e){toast('Impressão indisponível aqui. Use o CSV.')}},
 bkp:()=>sheet('Backup',`<p class="mut">O backup contém dados dos clientes e a configuração de acesso. Guarde-o em local privado; ele não é criptografado.</p><button class="btn" data-a="dlbkp">Baixar arquivo de backup</button>${txt(JSON.stringify(DB),'tx')}`),
 dlbkp:()=>downloadFile('FiadoPro-backup-'+stamp()+'.json',JSON.stringify(DB,null,2),'application/json;charset=utf-8'),
 rec:()=>sheet('Restaurar backup',`<p class="mut">Cole o backup abaixo. Ele substitui os dados deste aparelho e restaura a senha da época do backup.</p><textarea id="rb" rows="8" style="font-size:12px"></textarea><div class="err" id="er"></div><button class="btn" data-a="okRec">Restaurar</button>`),
 okRec:()=>{let o;try{o=JSON.parse($('#rb').value)}catch(e){}if(!o||!o.u||typeof o.u!=='object'||!Array.isArray(o.c)||!Array.isArray(o.m)||o.c.some(c=>!c||typeof c.id!=='string'||typeof c.n!=='string')||o.m.some(m=>!m||typeof m.c!=='string'||!Number.isSafeInteger(m.d)||!Number.isSafeInteger(m.a)||!Number.isSafeInteger(m.p)))return fail('Backup inválido ou incompatível. Nenhum dado foi alterado.');ask('Substituir todos os dados deste aparelho pelo backup?',()=>{o.p=o.p||SEED();DB=o;save();S.ok=false;closeS();render();toast('Backup restaurado')},'Restaurar')},
 big:x=>{DB.big=x=='1';save();render()},
 pm:x=>{const[id,d]=x.split('|'),p=DB.p.find(y=>y.id==id);if(!p)return;if(+d>0&&!p.pr)return toast('Digite o preço do produto primeiro');const q=Math.max(0,(S.cart[id]||0)+ +d);S.cart[id]=q;const c=$('#pc'+id);c.querySelector('.q').textContent=q;c.classList.toggle('on',q>0);A.calcT()},
 prods:()=>sheet('Produtos',`<div id="pl">${prodL()}</div><button class="btn" data-a="newP">Novo produto</button>`),
 newP:()=>sheet('Novo produto',pform()),editP:x=>sheet('Editar produto',pform(DB.p.find(y=>y.id==x))),
 pfile:f=>{if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.pimg=c.toDataURL('image/png');$('#pvw').innerHTML=pimg({img:S.pimg,n:''},120)};im.onerror=()=>fail('Não consegui abrir esta imagem.');im.src=r.result};r.readAsDataURL(f)},
 saveP:x=>{const n=$('#pn').value.trim();if(!n)return fail('Informe o nome do produto.');const v=$('#ppr').value.trim(),pr=v?num(v):0;if(v&&isNaN(pr))return fail('Preço inválido.');if(x)Object.assign(DB.p.find(y=>y.id==x),{n,pr,img:S.pimg});else DB.p.push({id:uid(),n,pr,img:S.pimg});save();A.prods();toast('Produto salvo')},
 delP:x=>ask('Apagar este produto da lista? As compras já lançadas continuam no histórico.',()=>{DB.p=DB.p.filter(y=>y.id!=x);save();A.prods()},'Apagar'),
 chk:()=>{const b=check();toast(b?`${b} inconsistência(s) encontrada(s)`:'Tudo certo: saldos consistentes')}
};
function pkL(q){q=q.toLowerCase();const dg=q.replace(/\D/g,'');return DB.c.filter(c=>!q||c.n.toLowerCase().includes(q)||(dg&&(c.tel||'').replace(/\D/g,'').includes(dg))).slice(0,30).map(c=>`<button class="row" data-a="pickgo" data-x="${c.id}"><div class="av">${esc(c.n[0])}</div><div><b>${esc(c.n)}</b></div><b>${R(bal(c.id))}</b></button>`).join('')||'<div class="empty">Nenhum cliente encontrado.</div>'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.x)});
document.addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(!i)return;if(i=='sq'){S.q=t.value;$('#lst').innerHTML=listH()}else if(i=='pk')$('#pkl').innerHTML=pkL(t.value);else if(i=='calc')A.calcT();else if(i=='pv')A.pv(t.dataset.x);else if(i=='aj')A.aj(t.dataset.x);else if(i=='pp'){const p=DB.p.find(y=>y.id==t.dataset.x),v=num(t.value);if(p){p.pr=isNaN(v)?0:v;save();A.calcT()}}});
document.addEventListener('change',e=>{const i=e.target.dataset.i;if(i=='rf'||i=='rt'){S[i]=e.target.value;render()}else if(i=='pf')A.pfile(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='pw')A.login()});
render();setTimeout(()=>$('#spl')?.remove(),1700);
</script></body></html>
